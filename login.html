<!DOCTYPE html>
<html lang="en">
<head>
  <title>Login - FIFA Itinerary</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/styles/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg bg-body-tertiary">
  <div class="container-fluid">
    <a class="navbar-brand" href="index.html">Itinerary</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
      aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarSupportedContent">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="schedule.html">Schedule</a></li>
        <li class="nav-item"><a class="nav-link" href="recommendations.html">Recommendations</a></li>
        <li class="nav-item"><a class="nav-link" href="favorites.html">Favorites</a></li>
      </ul>
      <button id="btnDarkMode" class="btn btn-outline-secondary btn-sm me-2">🌙</button>
      <span id="navUserLabel" class="text-muted small me-2" style="display:none;"></span>
      <button id="btnLogout" class="btn btn-outline-danger btn-sm me-2" style="display:none;">Logout</button>
      <a id="btnLogin" href="login.html" class="btn btn-outline-success" style="display:none;">Login</a>
    </div>
  </div>
</nav>

<div class="container py-5" style="max-width: 520px;">

  <!-- LOGGED OUT: show login/signup form -->
  <div id="loggedOutSection">
    <div class="bg-body-tertiary rounded-3 p-4">
      <h1 class="fw-bold mb-2">Login / Signup</h1>
      <p class="text-muted mb-4">Sign in to continue your FIFA itinerary planning.</p>
      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input id="email" type="email" class="form-control" placeholder="name@email.com" required>
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <input id="password" type="password" class="form-control" placeholder="Password" required>
      </div>
      <div class="d-grid gap-2">
        <button id="btnLoginSubmit" class="btn btn-success" type="button">Log In</button>
        <button id="btnSignup" class="btn btn-primary" type="button">Sign Up</button>
      </div>
      <p id="msg" class="mt-3 mb-0 small"></p>
      <a href="index.html" class="d-block mt-3">← Back to Home</a>
    </div>
  </div>

  <!-- LOGGED IN: show user info and logout -->
  <div id="loggedInSection" style="display:none;">
    <div class="bg-body-tertiary rounded-3 p-4 text-center">
      <div class="mb-3" style="font-size:3rem;">👋</div>
      <h4 class="fw-bold mb-1">You're logged in</h4>
      <p class="text-muted mb-1">Signed in as:</p>
      <p id="loggedInEmail" class="fw-bold mb-4"></p>
      <div class="d-grid gap-2">
        <a href="schedule.html" class="btn btn-success">Go to My Schedule</a>
        <button id="btnLogoutPage" class="btn btn-outline-danger">Log Out</button>
      </div>
      <a href="index.html" class="d-block mt-3">← Back to Home</a>
    </div>
  </div>

</div>

<footer class="border-top py-3">
  <div class="container d-flex justify-content-center align-items-center gap-4">
    <p class="mb-0 text-muted">&copy; 2026 FIFA Itinerary Planner</p>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="/src/darkMode.js"></script>
<script type="module" src="/src/authentication.js"></script>
</body>
</html>
