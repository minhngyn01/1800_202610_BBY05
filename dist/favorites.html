  <link rel="modulepreload" crossorigin href="/assets/backToTop-B7rdriag.js">
  <link rel="stylesheet" crossorigin href="/assets/firebaseConfig-B8vH44Br.css">
</head>
<body>

<nav class="navbar navbar-expand-lg bg-body-tertiary">
  <div class="container-fluid">
    <a class="navbar-brand" href="index.html">Itinerary</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
      aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarSupportedContent">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="schedule.html">Schedule</a></li>
        <li class="nav-item"><a class="nav-link" href="recommendations.html">Recommendations</a></li>
        <li class="nav-item"><a class="nav-link active" aria-current="page" href="favorites.html">Favorites</a></li>
      </ul>
      <button id="btnDarkMode" class="btn btn-outline-secondary btn-sm me-2">🌙</button>
      <a href="login.html" class="btn btn-outline-success" id="navAuthBtn">Login</a>
    </div>
  </div>
</nav>

<div class="p-5 mb-4 bg-body-tertiary rounded-3">
  <div class="container-fluid py-4">
    <h1 class="display-6 fw-bold">My Favorites</h1>
    <p class="fs-5 mb-0">Your saved places and restaurants — ready to add to your schedule.</p>
  </div>
</div>

<div class="container pb-4">
  <div id="favMsg" class="mb-3"></div>
  <div id="favsList" class="row g-3"></div>
</div>

<footer class="border-top py-3">
  <div class="container d-flex justify-content-center align-items-center gap-4">
    <p class="mb-0 text-muted">&copy; 2026 FIFA Itinerary Planner</p>
  </div>
</footer>

<!-- Template: favorite card -->
<template id="tmpl-fav">
  <div class="col-md-6 col-lg-4">
    <div class="card h-100 shadow-sm">
      <img class="t-img card-img-top" alt="" style="height:180px;object-fit:cover;">
      <div class="card-body d-flex flex-column">
        <div class="d-flex justify-content-between align-items-start mb-1">
          <h5 class="t-name card-title mb-0"></h5>
          <span class="t-badge badge ms-2 flex-shrink-0"></span>
        </div>
        <p class="t-area card-text mb-1 small text-muted"></p>
        <p class="t-desc card-text mb-3"></p>

        <!-- Add to schedule mini-form -->
        <div class="t-ats-form border rounded p-2 mb-3 bg-light" style="display:none;">
          <p class="mb-2 small fw-semibold">Add to Schedule</p>
          <div class="row g-2">
            <div class="col-12">
              <label class="form-label mb-1 small">Date</label>
              <input type="date" class="form-control form-control-sm t-ats-date">
            </div>
            <div class="col-6">
              <label class="form-label mb-1 small">Start</label>
              <input type="time" class="form-control form-control-sm t-ats-start" value="10:00">
            </div>
            <div class="col-6">
              <label class="form-label mb-1 small">End</label>
              <input type="time" class="form-control form-control-sm t-ats-end" value="12:00">
            </div>
            <div class="col-12">
              <label class="form-label mb-1 small">Type</label>
              <select class="form-select form-select-sm t-ats-type">
                <option value="Explore">Explore</option>
                <option value="Eat">Eat</option>
                <option value="Match">Match</option>
                <option value="Travel">Travel</option>
              </select>
            </div>
          </div>
          <p class="t-ats-err text-danger small mt-1 mb-0"></p>
          <div class="d-flex gap-2 mt-2">
            <button class="btn btn-primary btn-sm t-ats-confirm w-100">Confirm</button>
            <button class="btn btn-outline-secondary btn-sm t-ats-cancel">Cancel</button>
          </div>
        </div>

        <!-- Action buttons -->
        <div class="mt-auto d-flex gap-2 flex-wrap">
          <a class="t-maps btn btn-outline-primary btn-sm" target="_blank" rel="noopener">Open in Maps</a>
          <button class="t-ats-toggle btn btn-outline-success btn-sm">+ Schedule</button>
          <button class="t-unfav btn btn-danger btn-sm ms-auto">
            <span class="material-icons" style="font-size:16px;vertical-align:middle;">favorite</span> Remove
          </button>
        </div>
      </div>
    </div>
  </div>
</template>

<!-- Template: empty favorites -->
<template id="tmpl-empty">
  <div class="col-12">
    <div class="alert alert-info mb-0">
      You haven't saved any favorites yet. Head to <a href="recommendations.html">Recommendations</a> to start saving!
    </div>
  </div>
</template>

<!-- Template: logged out state -->
<template id="tmpl-loggedout">
  <div class="col-12">
    <div class="alert alert-warning mb-0">
      Please <a href="login.html">log in</a> to view your favorites.
    </div>
  </div>
</template>

<!-- Back to Top Button -->
<button id="backToTop" class="btn btn-primary rounded-circle shadow"
  style="position:fixed;bottom:80px;right:24px;width:44px;height:44px;display:none;z-index:9998;">
  <span class="material-icons" style="font-size:20px;line-height:1;">arrow_upward</span>
</button>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
