<!DOCTYPE html>
<html lang="en">
<head>
  <title>Recommendations - FIFA Itinerary</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/styles/style.css">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg bg-body-tertiary">
  <div class="container-fluid">
    <a class="navbar-brand" href="index.html">Itinerary</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
      aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarSupportedContent">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="schedule.html">Schedule</a></li>
        <li class="nav-item"><a class="nav-link active" aria-current="page" href="recommendations.html">Recommendations</a></li>
        <li class="nav-item"><a class="nav-link" href="favorites.html">Favorites</a></li>
      </ul>
      <button id="btnDarkMode" class="btn btn-outline-secondary btn-sm me-2">🌙</button>
      <a href="login.html" class="btn btn-outline-success" id="navAuthBtn">Login</a>
    </div>
  </div>
</nav>

<div class="p-5 mb-4 bg-body-tertiary rounded-3">
  <div class="container-fluid py-4">
    <h1 class="display-6 fw-bold">Vancouver Recommendations</h1>
    <p class="fs-5 mb-3">Explore nearby attractions and restaurants. Save favorites for your itinerary.</p>
    <div class="row g-2 align-items-end">
      <div class="col-md-3">
        <div class="form-check mb-2">
          <input class="form-check-input" type="checkbox" id="vegFilter">
          <label class="form-check-label" for="vegFilter">Vegetarian</label>
        </div>
        <label class="form-label">Category</label>
        <select id="categoryFilter" class="form-select">
          <option value="All" selected>All</option>
          <option value="Explore">Places to Explore</option>
          <option value="Eat">Restaurants</option>
        </select>
      </div>
      <div class="col-md-3">
        <label class="form-label">Area</label>
        <select id="areaFilter" class="form-select">
          <option value="All" selected>All Areas</option>
          <option value="Downtown">Downtown</option>
          <option value="Kitsilano">Kitsilano</option>
          <option value="UBC">UBC</option>
          <option value="North Vancouver">North Vancouver</option>
          <option value="Richmond">Richmond</option>
        </select>
      </div>
      <div class="col-md-4">
        <label class="form-label">Search</label>
        <input id="searchBox" class="form-control" type="search" placeholder="Try: park, sushi, museum...">
      </div>
      <div class="col-md-2 d-flex gap-2">
        <button id="btnFavoritesOnly" class="btn btn-outline-secondary w-100" type="button">Favorites</button>
        <button id="btnClear" class="btn btn-secondary w-100" type="button">Clear</button>
      </div>
    </div>
    <p id="msg" class="mt-3 mb-0"></p>
  </div>
</div>

<div class="container pb-4">
  <!-- Weather widget - shown when arriving from schedule page with a date -->
  <div id="weatherWidget" class="mb-4"></div>
  <div id="recsList" class="row g-3"></div>
</div>

<footer class="border-top py-3">
  <div class="container d-flex justify-content-between align-items-center">
    <p class="mb-0 text-muted">&copy; 2026 FIFA Itinerary Planner</p>
    <div class="d-flex gap-4">
      <span class="material-icons">favorite</span>
      <span class="material-icons">home</span>
      <span class="material-icons">map</span>
    </div>
  </div>
</footer>

<!-- Template: recommendation card -->
<template id="tmpl-rec">
  <div class="col-md-6 col-lg-4">
    <div class="card h-100 shadow-sm">
      <img class="t-img card-img-top" alt="" style="height:180px;object-fit:cover;">
      <div class="card-body d-flex flex-column">
        <div class="d-flex justify-content-between align-items-start mb-1">
          <h5 class="t-name card-title mb-0"></h5>
          <span class="t-badge badge ms-2 flex-shrink-0"></span>
        </div>
        <p class="t-area card-text mb-1 small text-muted"></p>
        <p class="t-desc card-text mb-3"></p>
        <!-- Add to schedule mini-form -->
        <div class="t-ats-form border rounded p-2 mb-3 bg-light" style="display:none;">
          <p class="mb-2 small fw-semibold">Add to Schedule</p>
          <div class="row g-2">
            <div class="col-12">
              <label class="form-label mb-1 small">Date</label>
              <input type="date" class="form-control form-control-sm t-ats-date">
            </div>
            <div class="col-6">
              <label class="form-label mb-1 small">Start</label>
              <input type="time" class="form-control form-control-sm t-ats-start" value="10:00">
            </div>
            <div class="col-6">
              <label class="form-label mb-1 small">End</label>
              <input type="time" class="form-control form-control-sm t-ats-end" value="12:00">
            </div>
            <div class="col-12">
              <label class="form-label mb-1 small">Type</label>
              <select class="form-select form-select-sm t-ats-type">
                <option value="Explore">Explore</option>
                <option value="Eat">Eat</option>
                <option value="Match">Match</option>
                <option value="Travel">Travel</option>
              </select>
            </div>
          </div>
          <p class="t-ats-err text-danger small mt-1 mb-0"></p>
          <div class="d-flex gap-2 mt-2">
            <button class="btn btn-primary btn-sm t-ats-confirm w-100">Confirm</button>
            <button class="btn btn-outline-secondary btn-sm t-ats-cancel">Cancel</button>
          </div>
        </div>
        <!-- Action buttons -->
        <div class="mt-auto d-flex gap-2 flex-wrap">
          <a class="t-maps btn btn-outline-primary btn-sm" target="_blank" rel="noopener">Open in Maps</a>
          <button class="t-ats-toggle btn btn-outline-success btn-sm">+ Schedule</button>
          <button class="t-fav btn btn-primary btn-sm ms-auto"></button>
        </div>
      </div>
    </div>
  </div>
</template>

  <!-- Template: no results -->
  <template id="tmpl-no-results">
    <div class="col-12">
      <div class="alert alert-warning mb-0">No recommendations match your filters.</div>
    </div>
  </template>
<!-- Back to Top Button -->
<button id="backToTop" class="btn btn-primary rounded-circle shadow" 
  style="position:fixed;bottom:80px;right:24px;width:44px;height:44px;display:none;z-index:9998;">
  <span class="material-icons" style="font-size:20px;line-height:1;">arrow_upward</span>
</button>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="/src/darkMode.js"></script>
  <script type="module" src="/src/recommendations.js"></script>
</body>
</html>
