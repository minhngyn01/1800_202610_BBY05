<!DOCTYPE html>
<html lang="en">
<head>
  <title>Recommendations - FIFA Itinerary</title>
  <meta name="comp1800 template" content="My 1800 App">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  
  <link rel="stylesheet" href="/styles/style.css">

  <!-- Material Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>

<body>

  
  <nav class="navbar navbar-expand-lg bg-body-tertiary">
    <div class="container-fluid">
      <a class="navbar-brand" href="index.html">Itinerary</a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
        aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="schedule.html">Schedule</a></li>
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="recommendations.html">Recommendations</a>
          </li>
        </ul>

        <a href="login.html" class="btn btn-outline-success">Login</a>
      </div>
    </div>
  </nav>

  <!-- Hero / Controls -->
  <div class="p-5 mb-4 bg-light rounded-3">
    <div class="container-fluid py-4">
      <h1 class="display-6 fw-bold">Vancouver Recommendations</h1>
      <p class="fs-5 mb-3">Explore nearby attractions and restaurants. Save favorites for your itinerary.</p>

      <div class="row g-2 align-items-end">
        <div class="col-md-3">
          <div class="col-md-2">
  <label class="form-label">Diet</label>
  <div class="form-check">
    <input class="form-check-input" type="checkbox" id="vegFilter">
    <label class="form-check-label" for="vegFilter">
      Vegetarian
    </label>
  </div>
</div>
          <label class="form-label">Category</label>
          <select id="categoryFilter" class="form-select">
            <option value="All" selected>All</option>
            <option value="Explore">Places to Explore</option>
            <option value="Eat">Restaurants</option>
          </select>
        </div>

        <div class="col-md-3">
          <label class="form-label">Area</label>
          <select id="areaFilter" class="form-select">
            <option value="All" selected>All Areas</option>
            <option value="Downtown">Downtown</option>
            <option value="Kitsilano">Kitsilano</option>
            <option value="UBC">UBC</option>
            <option value="North Vancouver">North Vancouver</option>
            <option value="Richmond">Richmond</option>
          </select>
        </div>

        <div class="col-md-4">
          <label class="form-label">Search</label>
          <input id="searchBox" class="form-control" type="search" placeholder="Try: park, sushi, museum...">
        </div>

        <div class="col-md-2 d-flex gap-2">
          <button id="btnFavoritesOnly" class="btn btn-outline-secondary w-100" type="button">
            Favorites
          </button>
          <button id="btnClear" class="btn btn-secondary w-100" type="button">
            Clear
          </button>
        </div>
      </div>

      <p id="msg" class="mt-3 mb-0"></p>
    </div>
  </div>

  <!-- Cards -->
  <div class="container pb-4">
    <div id="recsList" class="row g-3"></div>
  </div>

  
  <footer class="border-top py-3">
    <div class="container d-flex justify-content-between align-items-center">
      <p class="mb-0 text-muted">&copy; 2026 FIFA Itinerary Planner</p>
      <div class="d-flex gap-4">
        <span class="material-icons">favorite</span>
        <span class="material-icons">home</span>
        <span class="material-icons">map</span>
      </div>
    </div>
  </footer>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Page JS -->
  <script type="module" src="/src/recommendations.js"></script>
</body>
</html>
